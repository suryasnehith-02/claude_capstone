# Hook switches. KEY=VALUE, one per line. Edited by humans only (agents cannot write .claude/**).

# Append events (delegations, skills, MCP calls, commands, approvals questions) to .sdlc/audit/<KEY>.log
AUDIT_ENABLED=1

# 1 = a gate may be recorded as `approved` in state only if the audit log already shows an AskUserQuestion
#     whose header names that gate. Keep 0 until you have confirmed in an interactive session that the
#     AskUserQuestion event is logged (see docs/framework/TROUBLESHOOTING.md), then set to 1.
REQUIRE_GATE_QUESTION_IN_AUDIT=0
