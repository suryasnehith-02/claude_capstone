# Which files each actor may create or modify with Write/Edit while an SDLC workflow is active.
# Read by pre-implementation-check.sh. Matching is case-insensitive; `*` matches any characters including `/`;
# <KEY> is replaced by the active issue key. Paths are relative to the repository root.
#
# agent|stages|allow_globs|deny_globs|requires
#   agent      '-' = the Orchestrator (main thread; it reports agent_type sdlc-orchestrator) and any actor not listed
#   stages     comma list of current_stage values in which the agent may write, or * for any
#   deny_globs are checked before allow_globs
#   requires   source-gates = gates G1-G4 valid, current_stage 5, and the git branch is not protected
-|*|.sdlc/state/<KEY>.json,.sdlc/active,docs/sdlc/<KEY>/clarifications.md,docs/sdlc/<KEY>/approvals.md,docs/sdlc/<KEY>/open-issues.md||
requirements-analyst|1|docs/sdlc/<KEY>/*||
solution-architect|2|docs/sdlc/<KEY>/architecture.md,docs/sdlc/<KEY>/repo-profile.md||
design-reviewer|3|docs/sdlc/<KEY>/design-review.md||
implementation-planner|4|docs/sdlc/<KEY>/impl-plan.md,docs/sdlc/<KEY>/repo-profile.md||
developer|5|*|.sdlc/*,docs/sdlc/<KEY>/requirements.md,docs/sdlc/<KEY>/clarifications.md,docs/sdlc/<KEY>/approvals.md,docs/sdlc/<KEY>/open-issues.md,docs/sdlc/<KEY>/repo-profile.md,docs/sdlc/<KEY>/architecture.md,docs/sdlc/<KEY>/design-review.md,docs/sdlc/<KEY>/impl-plan.md,docs/sdlc/<KEY>/code-review.md,docs/sdlc/<KEY>/verification-report.md,docs/sdlc/<KEY>/verification-artifacts/*,docs/sdlc/<KEY>/branch-plan.md,docs/sdlc/<KEY>/pr-description.md,docs/sdlc/<KEY>/attachments/*|source-gates
code-reviewer|6|docs/sdlc/<KEY>/code-review.md||
verification-agent|7|docs/sdlc/<KEY>/verification-report.md,docs/sdlc/<KEY>/verification-artifacts/*||
pr-manager|4,5,8|docs/sdlc/<KEY>/branch-plan.md,docs/sdlc/<KEY>/pr-description.md,changelog*,*/changelog*,changes*,*/changes*,history*,*/history*,news*,*/news*||
