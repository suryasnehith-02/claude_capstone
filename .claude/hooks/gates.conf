# Canonical human-approval gates. Read by hooks (awk -F'|') and documented in the `sdlc` skill.
# gate|stage_decided_in|artifacts_covered|description
#   artifacts_covered: comma-separated, relative to docs/sdlc/<KEY>/. When a gate is recorded as approved,
#   a hook stores a content hash of these files in .sdlc/state/<KEY>.hashes. If any file changes later the
#   approval no longer counts and must be re-obtained.
G1|1|requirements.md|Requirements clarification and finalization
G2|3|architecture.md,design-review.md|Architecture approval (after independent design review)
G3|4|impl-plan.md|Implementation plan approval
G4|5|impl-plan.md,branch-plan.md|Implementation kickoff: branch and file scope
G5|6|code-review.md|Code review resolution
G6|7|verification-report.md|Verification approval
G7|8|pr-description.md|Final pull request approval
