# Loopback only by default; port is configurable (NFR-9).
server.address=127.0.0.1
server.port=8080

# Storage. Relative paths are resolved against the working directory (run from backend/).
todo.data-file=./data/todo.db
todo.store.journal-mode=DELETE

# Property names below are the Spring Boot 4.1.3 names (checked against the spring-boot jars'
# configuration metadata); the server.error.* and server.servlet.encoding.* names are deprecated
# there with level "error" and are replaced by the spring.web.error.* and spring.servlet.encoding.* names.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
spring.mvc.formcontent.filter.enabled=false
spring.mvc.hiddenmethod.filter.enabled=false
spring.servlet.multipart.enabled=false
spring.web.resources.add-mappings=false
spring.servlet.encoding.enabled=false

# SchemaInitializer is the only schema path (architecture C10): Boot's SQL script initialiser must never run a
# schema.sql or data.sql, now or when someone adds one later.
spring.sql.init.mode=never
